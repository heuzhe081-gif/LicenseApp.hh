<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DARK VIP | لوحة التحكم</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root{--bg:#050508;--cy:#00f2fe;--vi:#4facfe;--ok:#00e676;--warn:#ffb300;--bad:#ff1744;--tx:#f0f0f5;--mut:#8b93a7}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Cairo',sans-serif;min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:
 linear-gradient(rgba(0,242,254,0.03) 1px, transparent 1px),
 linear-gradient(90deg, rgba(0,242,254,0.03) 1px, transparent 1px);
 background-size: 30px 30px; pointer-events:none}
body::after{content:"";position:fixed;inset:0;z-index:-1;background:
 radial-gradient(circle at 80% 10%, rgba(0,242,254,0.15) 0%, transparent 40%),
 radial-gradient(circle at 20% 90%, rgba(79,172,254,0.15) 0%, transparent 40%)}
.glass{background:rgba(15,15,20,0.6);border:1px solid rgba(255,255,255,0.08);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:20px;box-shadow: 0 10px 30px rgba(0,0,0,0.5)}
.neon-text{background: linear-gradient(90deg, var(--cy), var(--vi));-webkit-background-clip: text;-webkit-text-fill-color: transparent;font-weight: 800}
.mono{font-family:'JetBrains Mono',monospace;direction:ltr;unicode-bidi:isolate}
button,input,select{font:inherit;color:inherit;outline:none}
.btn{border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.05);border-radius:12px;padding:.6rem 1rem;cursor:pointer;transition:all .2s;white-space:nowrap;font-weight:600}
.btn:hover{background:rgba(255,255,255,0.1);transform:translateY(-1px)}
.btn.primary{background:linear-gradient(135deg,var(--cy),var(--vi));color:#000;border:none;box-shadow:0 0 15px rgba(0,242,254,0.4)}
.btn.primary:hover{box-shadow:0 0 25px rgba(0,242,254,0.7)}
.btn.bad{border-color:rgba(255,23,68,0.3);color:var(--bad)}
.btn.bad:hover{background:rgba(255,23,68,0.1);border-color:var(--bad)}
.chip{border:1px solid rgba(255,255,255,0.1);border-radius:999px;padding:.5rem 1.2rem;cursor:pointer;background:transparent;transition:all .2s;font-weight:600;font-size:0.9rem}
.chip[aria-pressed=true]{background:rgba(0,242,254,0.1);border-color:var(--cy);color:var(--cy);box-shadow:0 0 15px rgba(0,242,254,0.2)}
.inp{background:rgba(0,0,0,0.4);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:.7rem 1rem;width:100%;transition:border .2s}
.inp:focus{border-color:var(--cy);box-shadow:0 0 10px rgba(0,242,254,0.1)}
.stat{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.05);border-radius:16px;padding:1.2rem;position:relative;overflow:hidden}
.stat::before{content:"";position:absolute;top:0;right:0;width:4px;height:100%;background:var(--c,var(--cy))}
.stat b{font-size:2rem;font-weight:800;display:block;line-height:1.2;color:var(--tx)}
.stat span{color:var(--mut);font-size:.9rem;font-weight:600}
.row,.thead{display:grid;grid-template-columns:1fr 1fr;gap:1rem;padding:1.2rem}
.row{border-top:1px solid rgba(255,255,255,0.05);border-inline-start:4px solid var(--idle);transition:all .2s}
.row:hover{background:rgba(255,255,255,0.02)}
.row[data-s=active]{border-inline-start-color:var(--ok)}
.row[data-s=expired]{border-inline-start-color:var(--warn)}
.row[data-s=disabled]{border-inline-start-color:var(--bad)}
.k,.acts{grid-column:1/-1}
.acts{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:0.5rem}
.lbl{display:block;color:var(--mut);font-size:.8rem;margin-bottom:.2rem;font-weight:600}
.thead{display:none;color:var(--mut);font-size:.9rem;font-weight:800;background:rgba(0,0,0,0.3);border-bottom:1px solid rgba(255,255,255,0.05)}
.key-btn{background:rgba(0,242,254,0.05);border:1px dashed rgba(0,242,254,0.3);border-radius:8px;padding:.4rem .8rem;cursor:pointer;font-size:.95rem;letter-spacing:.05em;color:var(--cy);transition:all .2s}
.key-btn:hover{background:rgba(0,242,254,0.15);border-style:solid}
.pill{display:inline-block;padding:.2rem .8rem;border-radius:999px;font-size:.8rem;font-weight:800;border:1px solid currentColor;box-shadow:0 0 10px currentColor}
.p-active{color:var(--ok);background:rgba(0,230,118,0.1)}.p-unused{color:var(--idle);background:rgba(139,147,167,0.1)}
.p-expired{color:var(--warn);background:rgba(255,179,0,0.1)}.p-disabled{color:var(--bad);background:rgba(255,23,68,0.1)}
@media(min-width:768px){
 .row,.thead{grid-template-columns:2.5fr 1fr 1.5fr 1.5fr auto;align-items:center}
 .thead{display:grid}.k,.acts{grid-column:auto}.row .lbl{display:none}.acts{margin-top:0}
}
#toast{position:fixed;bottom:2rem;left:50%;transform:translateX(-50%) translateY(20px);padding:.8rem 2rem;z-index:50;opacity:0;pointer-events:none;transition:all .3s cubic-bezier(0.68, -0.55, 0.265, 1.55);background:rgba(0,242,254,0.1);border:1px solid var(--cy);border-radius:999px;color:var(--cy);font-weight:800;box-shadow:0 0 20px rgba(0,242,254,0.3)}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#login{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;padding:1rem;background:rgba(5,5,8,0.9);backdrop-filter:blur(10px)}
</style>
</head>
<body>

<div id="login">
  <form id="loginForm" class="glass p-8 w-full max-w-sm space-y-5 relative overflow-hidden">
    <div style="position:absolute;top:0;left:0;width:100%;height:4px;background:linear-gradient(90deg,var(--cy),var(--vi))"></div>
    <h2 class="text-3xl neon-text text-center mb-6">DARK VIP</h2>
    <p class="text-center text-sm mb-4" style="color:var(--mut)">لوحة التحكم المركزية</p>
    <input id="tok" type="password" class="inp mono text-center" placeholder="ADMIN_TOKEN" autocomplete="current-password" required>
    <p id="loginErr" class="text-sm text-center" style="color:var(--bad); font-weight:700"></p>
    <button class="btn primary w-full text-lg">دخول آمن 🚀</button>
  </form>
</div>

<main class="max-w-6xl mx-auto p-4 md:p-8 space-y-6">
  <header class="flex items-center justify-between gap-3 glass p-4">
    <div class="flex items-center gap-3">
        <div style="width:12px;height:12px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok)"></div>
        <h1 class="text-2xl md:text-3xl neon-text">DARK VIP GZNZRATEUR</h1>
    </div>
    <div class="flex gap-2">
      <button class="btn" id="refresh">🔄 تحديث</button>
      <button class="btn bad" id="logout">🚪 خروج</button>
    </div>
  </header>

  <section class="grid grid-cols-2 md:grid-cols-4 gap-4" id="stats"></section>

  <section class="glass p-6 space-y-5 relative overflow-hidden">
    <div style="position:absolute;top:0;right:0;width:100%;height:3px;background:linear-gradient(90deg,transparent,var(--cy),transparent);opacity:0.5"></div>
    <h2 class="text-xl font-bold flex items-center gap-2"><span>✨</span> توليد أكواد جديدة</h2>
    <div class="flex flex-wrap gap-2" id="chips">
      <button class="chip" data-s="3600" aria-pressed="true">ساعة ⏱️</button>
      <button class="chip" data-s="10800" aria-pressed="false">3 ساعات ⏱️</button>
      <button class="chip" data-s="86400" aria-pressed="false">يوم 📅</button>
      <button class="chip" data-s="604800" aria-pressed="false">أسبوع 📆</button>
      <button class="chip" data-s="custom" aria-pressed="false">مخصص ⚙️</button>
    </div>
    <div id="customBox" class="hidden grid grid-cols-2 gap-3 max-w-sm">
      <input id="cVal" type="number" min="1" value="2" class="inp" aria-label="المدة">
      <select id="cUnit" class="inp" aria-label="الوحدة">
        <option value="60">دقائق</option><option value="3600" selected>ساعات</option><option value="86400">أيام</option>
      </select>
    </div>
    <div class="flex flex-wrap items-end gap-4 bg-black/20 p-4 rounded-xl border border-white/5">
      <label class="block w-32"><span class="lbl">الكمية (1–100)</span>
        <input id="qty" type="number" min="1" max="100" value="1" class="inp mono text-center text-lg font-bold"></label>
      <button class="btn primary flex-1 text-lg" id="gen">توليد الأكواد 🚀</button>
    </div>
    <div id="result" class="hidden space-y-3 bg-black/30 p-4 rounded-xl border border-var(--cy)">
      <div class="flex items-center justify-between"><span class="lbl" style="margin:0; color:var(--cy)">الأكواد الجديدة جاهزة</span>
        <button class="btn" id="copyAll">📋 نسخ الكل</button></div>
      <pre id="resultTxt" class="mono inp text-sm overflow-auto max-h-48 m-0 leading-relaxed text-[var(--cy)] bg-black/50"></pre>
    </div>
  </section>

  <section class="glass overflow-hidden">
    <div class="p-4 flex flex-col sm:flex-row gap-3 bg-black/20 border-b border-white/5">
      <input id="q" class="inp mono" placeholder="🔍 بحث بالكود أو HWID" style="direction:ltr">
      <select id="f" class="inp sm:max-w-[12rem]">
        <option value="">كل الحالات</option><option value="active">نشط</option><option value="unused">غير مفعّل</option>
        <option value="expired">منتهي</option><option value="disabled">معطّل</option>
      </select>
    </div>
    <div class="thead"><div>الكود</div><div>الحالة</div><div>ينتهي في</div><div>الجهاز (HWID)</div><div>تحكم</div></div>
    <div id="list"></div>
  </section>
</main>

<div id="toast" class="glass"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let TOKEN = '', KEYS = [], DUR = 3600;
try { TOKEN = localStorage.getItem('adm') || ''; } catch (e) {}

const ST = {active:'نشط', unused:'غير مفعّل', expired:'منتهي', disabled:'معطّل'};

function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove('on'),2500); }
function showLogin(err){ $('#login').style.display='flex'; $('#loginErr').textContent=err||''; $('#tok').focus(); }

async function api(path, method='GET', body){
  const r = await fetch(path, {method, headers:{'Content-Type':'application/json','X-Admin-Token':TOKEN}, body: body ? JSON.stringify(body) : undefined});
  if (r.status === 401){ showLogin(TOKEN ? 'الرمز غير صحيح' : ''); throw new Error('401'); }
  if (!r.ok){ let m='حدث خطأ'; try{ const j=await r.json(); m = typeof j.detail==='string' ? j.detail : m; }catch(e){} throw new Error(m); }
  return r.json();
}

function durLabel(s){
  if (s % 86400 === 0) return (s/86400) + ' يوم';
  if (s % 3600 === 0) return (s/3600) + ' ساعة';
  return Math.round(s/60) + ' دقيقة';
}
function when(k){
  if (k.expires_at == null) return 'يبدأ عند التفعيل (' + durLabel(k.duration) + ')';
  return new Date(k.expires_at*1000).toLocaleString('en-GB',{dateStyle:'short',timeStyle:'short'});
}

function render(){
  const n = s => KEYS.filter(k => k.status === s).length;
  const tiles = [
      ['إجمالي الأكواد',KEYS.length,'var(--cy)'],
      ['أكواد نشطة',n('active'),'var(--ok)'],
      ['غير مفعّلة',n('unused'),'var(--mut)'],
      ['منتهية / معطّلة',n('expired')+n('disabled'),'var(--bad)']
  ];
  $('#stats').innerHTML = tiles.map(t => `<div class="glass stat" style="--c:${t[2]}"><span>${t[0]}</span><b>${t[1]}</b></div>`).join('');

  const q = $('#q').value.trim().toLowerCase(), f = $('#f').value;
  const rows = KEYS.filter(k => (!f || k.status===f) && (!q || k.key.toLowerCase().includes(q) || (k.hwid||'').toLowerCase().includes(q)));
  $('#list').innerHTML = rows.length ? rows.map(k => `
    <div class="row" data-s="${k.status}" data-k="${esc(k.key)}">
      <div class="k"><span class="lbl">الكود</span><button class="key-btn mono" data-a="copy" title="نسخ">${esc(k.key)}</button></div>
      <div><span class="lbl">الحالة</span><span class="pill p-${k.status}">${ST[k.status]}</span></div>
      <div><span class="lbl">ينتهي في</span><span class="text-sm font-semibold" style="color:var(--mut)">${esc(when(k))}</span></div>
      <div class="k md:!col-auto"><span class="lbl">الجهاز</span><span class="mono text-sm" style="color:var(--mut)">${esc(k.hwid || '—')}</span></div>
      <div class="acts">
        <button class="btn text-sm" data-a="extend">+24 ساعة</button>
        <button class="btn text-sm" data-a="toggle" style="color:${k.active?'var(--warn)':'var(--ok)'}">${k.active ? 'تعطيل' : 'تفعيل'}</button>
        <button class="btn bad text-sm" data-a="del">حذف</button>
      </div>
    </div>`).join('') : '<p class="p-8 text-center font-bold" style="color:var(--mut)">لا توجد أكواد مطابقة. قم بتوليد أكواد جديدة.</p>';
}

async function load(){
  try { KEYS = await api('/api/keys'); $('#login').style.display='none'; render(); }
  catch(e){ if (e.message !== '401') toast(e.message); }
}

$('#loginForm').onsubmit = e => {
  e.preventDefault(); TOKEN = $('#tok').value.trim();
  try { localStorage.setItem('adm', TOKEN); } catch(x) {}
  load();
};
$('#logout').onclick = () => { TOKEN=''; try{localStorage.removeItem('adm');}catch(e){} showLogin(); };
$('#refresh').onclick = load;
$('#q').oninput = $('#f').onchange = render;

$('#chips').onclick = e => {
  const b = e.target.closest('.chip'); if (!b) return;
  document.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', c===b));
  DUR = b.dataset.s;
  $('#customBox').classList.toggle('hidden', DUR !== 'custom');
};

$('#gen').onclick = async () => {
  const secs = DUR === 'custom' ? Math.round(+$('#cVal').value * +$('#cUnit').value) : +DUR;
  const qty = Math.min(100, Math.max(1, parseInt($('#qty').value) || 1));
  if (!(secs >= 60)) return toast('المدة يجب أن تكون دقيقة على الأقل');
  const b = $('#gen'); b.disabled = true;
  try {
    const r = await api('/api/generate', 'POST', {duration: secs, quantity: qty});
    $('#resultTxt').textContent = r.keys.join('\n'); $('#result').classList.remove('hidden');
    toast('تم توليد ' + r.keys.length + ' كود بنجاح'); await load();
  } catch(e){ if (e.message !== '401') toast(e.message); }
  b.disabled = false;
};
$('#copyAll').onclick = () => navigator.clipboard.writeText($('#resultTxt').textContent).then(() => toast('تم نسخ الأكواد بنجاح'));

$('#list').onclick = async e => {
  const b = e.target.closest('button[data-a]'); if (!b) return;
  const key = b.closest('.row').dataset.k, a = b.dataset.a, u = '/api/key/' + encodeURIComponent(key);
  try {
    if (a === 'copy'){ await navigator.clipboard.writeText(key); return toast('تم نسخ الكود'); }
    if (a === 'del'){ if (!confirm('هل أنت متأكد من حذف هذا الكود نهائياً؟\n' + key)) return; await api(u, 'DELETE'); toast('تم حذف الكود'); }
    if (a === 'toggle'){ await api(u + '/toggle', 'POST'); toast('تم تغيير حالة الكود'); }
    if (a === 'extend'){ await api(u + '/extend', 'POST', {seconds: 86400}); toast('تمت إضافة 24 ساعة للكود'); }
    load();
  } catch(err){ if (err.message !== '401') toast(err.message); }
};

TOKEN ? load() : showLogin();
</script>
</body>
      </html>
